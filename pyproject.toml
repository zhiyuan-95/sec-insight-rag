[project]
name = "sec-insight-rag"
version = "0.1.0"
description = "Backend-first SEC Insight RAG system for evidence-grounded financial analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "fastembed>=0.7,<1.0",
    "llama-index-core>=0.12,<1.0",
    "llama-index-embeddings-fastembed>=0.3,<1.0",
    "llama-index-retrievers-bm25>=0.5,<1.0",
    "lxml>=5.3,<7.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
